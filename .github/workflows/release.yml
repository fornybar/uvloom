name: release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a stable semantic version, got: $version" >&2
            exit 1
          fi

          tag="v$version"
          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag exists at $tagged_sha, expected $GITHUB_SHA" >&2
              exit 1
            fi
            tag_exists=true
          fi

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_tag" && "$latest_tag" != "$tag" ]]; then
            latest_version="${latest_tag#v}"
            highest_version="$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -n 1)"
            if [[ "$highest_version" != "$version" ]]; then
              echo "VERSION $version is older than $latest_tag" >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Check flake
        run: nix flake check

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          if [[ "$TAG_EXISTS" == "true" ]]; then
            nix develop .#release -c git-cliff \
              --current \
              --strip header \
              --output release-notes.md
          else
            nix develop .#release -c git-cliff \
              --unreleased \
              --tag "$TAG" \
              --strip header \
              --output release-notes.md
          fi

      - name: Create tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$GITHUB_SHA" --message "Release $TAG"
          git push origin "$TAG"

      - name: Check existing GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --verify-tag
          --title "$TAG"
          --notes-file release-notes.md
