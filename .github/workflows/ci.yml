name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install commitlint
        run: npm ci --ignore-scripts
      - name: Lint pull request commits
        run: >-
          npx --no -- commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      - name: Check release notes
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          nix develop .#release -c git-cliff \
            --unreleased \
            --tag "$tag" \
            --strip header \
            --output /tmp/release-notes.md
      - name: Check examples against workspace uvloom
        run: |
          for example in examples/*; do
            if [ -f "$example/flake.nix" ]; then
              nix flake check "./$example" --override-input uvloom "path:$PWD" --no-write-lock-file
            fi
          done
