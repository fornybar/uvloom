[project]
name = "missing-member-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gonedep"]

[tool.uv.sources]
gonedep = { path = "vendored/gonedep" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missing_member_app"]
