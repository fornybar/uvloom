[project]
name = "path-source-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["localwheel"]

[tool.uv.sources]
localwheel = { path = "vendored/localwheel-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/path_source_app"]
