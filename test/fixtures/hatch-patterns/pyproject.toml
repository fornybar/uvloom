[project]
name = "hatch-patterns"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkg"]
include = ["pkg/*.py", "/tests"]
artifacts = ["src/pkg/data/*"]

[tool.hatch.build.targets.wheel.force-include]
"assets/schema.json" = "pkg/schema.json"
