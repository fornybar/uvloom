[project]
name = "dir-source-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["localdep"]

[tool.uv.sources]
localdep = { path = "vendored/localdep" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dir_source_app", "extra_pkg"]
