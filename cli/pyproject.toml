[project]
name = "uvloom-cli"
version = "0.1.0"
description = "The uv workflow with Nix guarantees, batteries-included overrides, and a paved road to a flake when you outgrow it."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fornybar" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fornybar/uvloom"
Repository = "https://github.com/fornybar/uvloom"
Documentation = "https://fornybar.github.io/uvloom/cli.html"

[project.scripts]
uvloom = "uvloom_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvloom_cli"]
# data/ holds non-Python package data (pins, templates); force-include keeps it
# in the wheel even if a file ever matches a VCS ignore pattern.
artifacts = ["src/uvloom_cli/data/*"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# importlib mode lets tests/unit/test_flakify.py and tests/e2e/test_flakify.py
# share a basename without __init__.py files. tests/unit goes on sys.path so
# its `from conftest import ...` helper imports still resolve under importlib.
addopts = "--import-mode=importlib"
# tests/e2e/test_warm_latency.py uses record_property; the xunit2 default
# rejects it, and CI records warm-path latency via junit properties.
junit_family = "legacy"
pythonpath = ["tests/unit"]
# A bare `pytest` from cli/ must never wander into tests/e2e: the session
# fixture there runs `nix build` (multi-hour cold builds). Unit tests only by
# default; CI and the justfile always pass explicit paths:
#   just cli-test       -> pytest tests/unit
#   just cli-e2e        -> pytest tests/e2e (pre-builds .#uvloom-cli)
#   just cli-e2e-fast   -> pytest tests/e2e -m 'not slow'
testpaths = ["tests/unit"]
