[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "smiley-plot"
version = "0.1.0"
description = "Tiny meshpy demo for uvloom examples"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.0",
  "meshpy>=2025.1.1",
]

[project.scripts]
plot-smiley = "smiley_plot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
